schema: spec-driven

# Project context: constraints that should guide OpenSpec artifacts.
# Research: docs/carplay-video-options.md and docs/re/mini-ultra-3.md
context: |
  This project reverse engineers a Carlinkit Mini Ultra 3 wireless CarPlay dongle that the
  owner has physical possession of, so it can run open firmware that accepts AirPlay
  mirroring from an iPhone and forwards the picture to the car over the dongle's wired
  CarPlay output. The car has a factory wired CarPlay port.
  Everything we write must be read-only toward the device unless a task explicitly says it
  writes, and every write path must be preceded by a verified full flash backup kept off the
  device. Never ship a step that cannot be reversed from that backup.
  The dongle hardware varies by unit (Allwinner V821B, Axera AX520, Anyka or V851SE). Tools
  must identify the variant first and refuse to proceed on an unsupported one.
  Build on existing open projects where they exist: catplay (Rust CarPlay rx and tx gadgets),
  LIVI Link (provisioning, backup, rescue), ocbm, UxPlay. Do not re-implement what they
  provide; wrap, document or extend.
  Host tooling is Python 3 and runs on Linux or macOS. This cloud session has no USB or
  hardware access, so hardware verification steps are performed by the owner and recorded.
  Netflix is out of scope for good (no AirPlay, DRM). Targets are Jellyfin, Plex and other
  non-DRM sources. Parked use only.

